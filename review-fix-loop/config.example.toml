# 配置样例（进入 Git，不含真实密钥）
# 使用：cp config.example.toml config.toml，在 config.toml 中填写真实路径与密钥（config.toml 已被 .gitignore 忽略）
# 运行：python3 loop.py [-c config.toml] [--check]

[project]
req_id   = "demo"                       # 需求标识，对应文档目录下的 *-demo-*.md
workdir  = "/path/to/workspace"         # 模型进程的工作目录（通常是各仓库的公共父目录）
repos    = [                            # 参与评审的 git 仓库，可以多个；只有一个时也可写 path = "..."
  "/path/to/workspace/repo-a",
  "/path/to/workspace/repo-b",
]
docs_dir = "/path/to/workspace/docs"    # request/design/implement/review 文档所在目录，默认 <workdir>/docs
# 验证/测试命令不在这里配置，直接写进修复提示词（见下方 [fixer] 的 extra_prompt 示例）

[loop]
max_rounds      = 5      # 最多迭代轮数
no_progress_max = 2      # 连续几轮"严重+高"数量不下降就停止
timeout_minutes = 60     # 单次模型调用超时
run_techdoc     = true   # 通过后是否自动生成最终技术文档
techdoc_role    = "fixer"

[skills]
# code-review-doc、tdd-implement、techdoc 等技能所在目录，默认是本目录的上一级（即本 skills 仓库）
# claude 通过软链接加载；kimi 通过 --skills-dir 加载；codex、kimi 的提示词开头还会注明该目录，让模型直接读取 SKILL.md
dir = "~/.claude/skills"

# 代理：任一角色设置 proxy = true 时，启动前在 bash 中依次执行以下命令，
# 再把得到的 http_proxy/https_proxy 等变量只传给这些角色的子进程。codex 必须走代理。
[proxy]
commands  = [
  "source ~/.config/clash-for-linux/profile.sh",
  "clashon",
  "clash mode global",
  "clash select Ghelper '美国洛杉矶2'",
]
check_url = "https://www.google.com"   # 开启后用 curl 检查是否能访问外网，留空跳过
# [proxy.env]                           # 自动获取失败时直接指定
# https_proxy = "http://127.0.0.1:7890"
# http_proxy  = "http://127.0.0.1:7890"

# ---------------------------------------------------------------------------
# 角色配置：reviewer（评审）和 fixer（修复）各选一种 engine，可以任意组合或互换
#
#   engine   登录方式                         说明
#   kimi     账号登录（先在终端执行 kimi login）  使用 ~/.kimi-code 中的登录状态，不需要 key
#   codex    账号登录（先在终端执行 codex login） 使用 ~/.codex 中的 ChatGPT 账号，必须 proxy = true
#   claude   密钥登录                           用于 DeepSeek 等 Anthropic 兼容接口，需要 base_url + auth_token
#                                               （或 settings_file 引用已有配置），密钥只写在 config.toml
#
# 通用字段：
#   model        可选，留空用各 CLI 或服务端默认模型
#   args         可选，追加到命令行的额外参数
#   skills_dir   可选，覆盖 [skills].dir
#   proxy        是否走 [proxy]，codex 需要 true
#   [角色.env]   可选，追加环境变量
#
# 提示词（自由书写，可用占位符见文件末尾）：
#   prompt       = "prompts/xxx.md"   提示词文件，相对本目录或绝对路径，默认 prompts/review.md、prompts/fixer.md
#   prompt_text  = """..."""          直接写完整提示词，优先于 prompt
#   extra_prompt = """..."""          在上面的提示词后追加一段，适合写验证命令、项目特有要求
# 程序会在提示词最后自动追加固定约定（无人值守、本轮评审文件名、问题标题格式、LOOP_STATUS），不需要自己写
# ---------------------------------------------------------------------------

# 组合一：DeepSeek 评审（密钥） + Kimi 修复（账号）
[reviewer]
engine     = "claude"
base_url   = "https://api.deepseek.com/anthropic"
auth_token = "sk-xxxxxxxx"              # 在 config.toml 中填真实 key
model      = "deepseek-flash"
# settings_file = "~/.claude/settings.json.deepseek"   # 也可以直接引用已有配置文件中的 env，替代上面三行
prompt     = "prompts/review.md"
extra_prompt = """
- 重点检查跨仓库接口是否一致。
- 用需求文档验收标准中的数值实际运行验证。
"""

# [reviewer.env]                        # DeepSeek 常用的额外变量，按需填写
# ANTHROPIC_DEFAULT_OPUS_MODEL   = "deepseek-flash"
# ANTHROPIC_DEFAULT_SONNET_MODEL = "deepseek-flash"
# ANTHROPIC_DEFAULT_HAIKU_MODEL  = "deepseek-flash"
# CLAUDE_CODE_SUBAGENT_MODEL     = "deepseek-flash"

[fixer]
engine = "kimi"
# model = "kimi-code/kimi-for-coding"
prompt = "prompts/fixer.md"
extra_prompt = """
- 验证命令（在各仓库目录下执行，全部通过才算修复完成）：
  cd /path/to/workspace/repo-a && make test
  cd /path/to/workspace/repo-b && python3 -m pytest -q
"""

# 组合二：Kimi 评审（账号） + DeepSeek 修复（密钥），把上面两段互换 engine 即可：
# [reviewer]
# engine = "kimi"
# prompt = "prompts/review.md"
#
# [fixer]
# engine     = "claude"
# base_url   = "https://api.deepseek.com/anthropic"
# auth_token = "sk-xxxxxxxx"
# model      = "deepseek-flash"
# prompt     = "prompts/fixer.md"

# 组合三：Codex 评审（账号，需外网） + Kimi 修复（账号）：
# [reviewer]
# engine = "codex"
# proxy  = true
# # model = "gpt-6-astra"
# # args  = ["-c", "model_reasoning_effort=\"high\""]
# prompt = "prompts/review.md"

[techdoc]                       # 技术文档提示词，由 [loop].techdoc_role 指定的角色执行
prompt = "prompts/techdoc.md"

# 提示词占位符：{round} 轮次号  {req_id}  {workdir}  {repos} 仓库列表  {docs_dir}
#              {implement_file} 实施文档  {review_file} 本轮评审文件
# 评审文件固定命名为 <docs_dir>/review-<req_id>-<YYYYMMDD>-roundNN.md，NN 接着已有最大轮次递增，不覆盖历史
