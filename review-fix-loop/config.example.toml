# 复制为 config.toml 后修改；config.toml 含密钥，已在 .gitignore 中忽略
# 运行：python3 loop.py [-c config.toml] [--check]

[project]
path     = "/path/to/project"   # 目标项目（git 仓库），docs/ 下需有 request/design/implement 文档
req_id   = "demo"               # 需求标识，对应 docs/*-demo-*.md
test_cmd = "python3 -m unittest -q"  # 每轮修复后由程序自己执行的回归命令

[loop]
max_rounds      = 5      # 最多迭代轮数
no_progress_max = 2      # 连续几轮"严重+高"数量不下降就停止
timeout_minutes = 60     # 单次模型调用超时
run_techdoc     = true   # 通过后是否自动生成最终技术文档
techdoc_role    = "fixer"

# 每个角色可以引用已有的 Claude Code 配置文件（取其中的 env），
# 也可以直接写 base_url / auth_token / model / env，直接写的值优先。

[reviewer]                      # 评审：DeepSeek
settings_file = "~/.claude/settings.json.deepseek"
# base_url   = "https://api.deepseek.com/anthropic"
# auth_token = "sk-..."
# model      = ""
prompt = "prompts/review.md"

[fixer]                         # 修复：Claude（第三方转发）
settings_file = "~/.claude/settings.json.public"
# base_url   = "https://..."
# auth_token = "sk-..."
model  = "claude-opus-5-5"
prompt = "prompts/fixer.md"

# [fixer.env]                   # 额外环境变量，按需填写
# CLAUDE_CODE_EFFORT_LEVEL = "high"
